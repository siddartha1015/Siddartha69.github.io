<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Siddartha Bhandari | Video Editor & Creative Designer</title>

    <meta name="description"
          content="Portfolio of Siddartha Bhandari — Video Editor, Graphic Designer and Creative Student.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #0b0b0f;
            --card: #14141a;
            --card2: #1b1b23;
            --text: #ffffff;
            --muted: #a7a7b0;
            --accent: #e8b39d;
            --accent2: #f2c6b0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 11, 15, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #292931;
        }

        .nav-container {
            max-width: 1150px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--accent);
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 25px 70px;
            background:
                radial-gradient(circle at 80% 20%, rgba(232,179,157,0.12), transparent 30%),
                radial-gradient(circle at 20% 80%, rgba(232,179,157,0.08), transparent 30%);
        }

        .hero-container {
            max-width: 1150px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

            font-size: clamp(45px, 7vw, 85px);
            line-height: 1;
            margin-bottom: 20px;
